name: Update IPTV links

on:
  schedule:
    # Two runs a day (UTC). GitHub may delay scheduled jobs by a few minutes.
    - cron: "23 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update database, playlists and dashboard
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/update.py --workers 24 --timeout 10

      - name: Commit results
        run: |
          git config user.name "iptv-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            # Keep the scheduled workflow alive even if nothing changed for
            # 60 days: GitHub disables schedules in inactive repositories.
            LAST=$(git log -1 --format=%ct)
            NOW=$(date +%s)
            if [ $(( (NOW - LAST) / 86400 )) -ge 30 ]; then
              date -u +%FT%TZ > data/heartbeat.txt
              git add data/heartbeat.txt
              echo "Monthly heartbeat added."
            else
              echo "No changes to commit."
              exit 0
            fi
          fi

          git commit -m "chore: refresh IPTV links [skip ci]"
          git push
